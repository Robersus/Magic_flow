<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Magic Flow</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h2 {
            color: #667eea;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .checkbox-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
        }
        .checkbox-group input {
            width: auto;
            margin-right: 8px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #764ba2;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>🎵 Únete a Magic Flow</h2>
        <p style="text-align: center; color: #666;">Regístrate y comienza tu viaje en la salsa</p>
        
        <form id="registroForm">
            <div class="form-group">
                <label for="nombre">Nombre completo *</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono (WhatsApp) *</label>
                <input type="tel" id="telefono" name="telefono" required>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="nivel">Nivel de baile</label>
                <select id="nivel" name="nivel">
                    <option value="Principiante">Principiante</option>
                    <option value="Intermedio">Intermedio</option>
                    <option value="Avanzado">Avanzado</option>
                </select>
            </div>

            <div class="form-group">
                <label>Intereses</label>
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" name="intereses" value="Clases presenciales">
                        Clases presenciales
                    </label>
                    <label>
                        <input type="checkbox" name="intereses" value="Clases online">
                        Clases online
                    </label>
                    <label>
                        <input type="checkbox" name="intereses" value="Eventos sociales">
                        Eventos sociales
                    </label>
                    <label>
                        <input type="checkbox" name="intereses" value="Competencias">
                        Competencias
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="objetivo">¿Qué quieres lograr con la salsa?</label>
                <textarea id="objetivo" name="objetivo" rows="4" placeholder="Cuéntanos tus metas..."></textarea>
            </div>

            <button type="submit">Registrarme</button>
        </form>

        <div id="message" class="message"></div>
    </div>

    <script>
        document.getElementById('registroForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const messageDiv = document.getElementById('message');
            const submitButton = this.querySelector('button[type="submit"]');
            
            // Deshabilitar botón durante el envío
            submitButton.disabled = true;
            submitButton.textContent = 'Enviando...';
            
            // Recopilar intereses seleccionados
            const interesesCheckboxes = document.querySelectorAll('input[name="intereses"]:checked');
            const intereses = Array.from(interesesCheckboxes).map(cb => cb.value);
            
            // Preparar datos
            const formData = {
                nombre: document.getElementById('nombre').value,
                telefono: document.getElementById('telefono').value,
                email: document.getElementById('email').value,
                nivel: document.getElementById('nivel').value,
                intereses: intereses,
                objetivo: document.getElementById('objetivo').value
            };
            
            try {
                const response = await fetch('https://villa84.app.n8n.cloud/webhook/registro-alumnos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = result.message;
                    messageDiv.style.display = 'block';
                    
                    // Limpiar formulario
                    this.reset();
                } else {
                    throw new Error(result.message || 'Error en el registro');
                }
                
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Error: ' + error.message;
                messageDiv.style.display = 'block';
            } finally {
                // Rehabilitar botón
                submitButton.disabled = false;
                submitButton.textContent = 'Registrarme';
            }
        });
    </script>
</body>
</html>
